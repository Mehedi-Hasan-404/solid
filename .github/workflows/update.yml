name: Update Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Write script
        env:
          SCRIPT: ${{ secrets.PLAYLIST_SCRIPT }}
        run: printenv SCRIPT > scraper.py

      - run: sed -i 's|/storage/emulated/0/Download/|./|g' scraper.py

      - run: python scraper.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update playlist $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
